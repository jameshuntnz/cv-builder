# Cloudflare Workers static assets: the built site in dist, no Worker script. Security and
# cache headers live in public/_headers, which is copied into dist. Deploy with
# `pnpm run deploy`, or connect the repository in Workers & Pages (build `pnpm build`,
# deploy `npx wrangler deploy`).
name = "cv-builder"
compatibility_date = "2026-10-05"

[assets]
directory = "./dist"
