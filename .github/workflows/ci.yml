name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Every journey in light, dark and on a phone, each page state scanned with axe.
      - run: pnpm e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report
            a11y-report
          retention-days: 14

  # The paper against the Typst template, line by line and pixel by pixel. macOS, because
  # the reference is set in Apple's Charter; poppler's pdftoppm draws both PDFs.
  vrt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: brew install poppler
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm vrt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report
          path: playwright-report
          retention-days: 14
